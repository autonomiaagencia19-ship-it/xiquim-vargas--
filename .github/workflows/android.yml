name: Build Android debug APKs

on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Build seller
        run: gradle --no-daemon --max-workers=1 -p mobile/seller-native assembleDebug
      - name: Build driver
        run: gradle --no-daemon --max-workers=1 -p mobile/driver-native assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: xiquim-vargas-1.8.1-debug-apks
          path: |
            mobile/seller-native/app/build/outputs/apk/debug/app-debug.apk
            mobile/driver-native/app/build/outputs/apk/debug/app-debug.apk
