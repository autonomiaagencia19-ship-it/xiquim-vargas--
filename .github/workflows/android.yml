name: Build Android debug APKs

on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Build seller
        run: gradle --no-daemon --max-workers=1 -p mobile/seller-native assembleDebug
      - name: Build driver
        run: gradle --no-daemon --max-workers=1 -p mobile/driver-native assembleDebug
      - name: Build pdv
        run: gradle --no-daemon --max-workers=1 -p mobile/pdv-native assembleDebug
      - name: Build tower
        run: gradle --no-daemon --max-workers=1 -p mobile/tower-native assembleDebug
      - name: Collect and name APKs
        run: |
          mkdir -p dist-apks
          cp mobile/seller-native/app/build/outputs/apk/debug/app-debug.apk dist-apks/XiquimVargas-Vendedor-1.8.3.apk
          cp mobile/driver-native/app/build/outputs/apk/debug/app-debug.apk dist-apks/XiquimVargas-Motorista-1.8.3.apk
          cp mobile/pdv-native/app/build/outputs/apk/debug/app-debug.apk dist-apks/XiquimVargas-PDV-1.8.3.apk
          cp mobile/tower-native/app/build/outputs/apk/debug/app-debug.apk dist-apks/XiquimVargas-TorreControle-1.8.3.apk
      - uses: actions/upload-artifact@v4
        with:
          name: xiquim-vargas-1.8.3-debug-apks
          path: dist-apks/*.apk
