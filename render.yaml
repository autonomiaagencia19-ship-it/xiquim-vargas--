services:
  - type: web
    name: xiquim-vargas-erp
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: STORAGE_DIR
        value: /var/data
      - key: PUBLIC_BASE_URL
        sync: false
    disk:
      name: erp-data
      mountPath: /var/data
      sizeGB: 10
